name: watchwolf-example

services:
  servers-manager:
    build:
      context: .
      dockerfile: control-plane.Dockerfile
      additional_contexts:
        manager_source: ../../../WatchWolf-ServersManager
        server_source: ../../../WatchWolf-Server
    ports:
      - "8000:8000"
    environment:
      MACHINE_IP: 127.0.0.1
      PUBLIC_IP: 127.0.0.1
      PARENT_PWD: /servers
      SERVER_PATH_SHIFT: .
      WATCHWOLF_MINECRAFT_RUNTIME: itzg
      WATCHWOLF_ITZG_TAG: auto
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8000'"]
      interval: 5s
      timeout: 2s
      retries: 24

  clients-manager:
    build:
      context: https://github.com/miranda1000/WatchWolf-Client.git#dev
    ports:
      - "7000:7000"
    environment:
      MACHINE_IP: 127.0.0.1
      PUBLIC_IP: 127.0.0.1
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; socket.create_connection((\"127.0.0.1\", 7000), 2).close()'"]
      interval: 5s
      timeout: 3s
      retries: 24
