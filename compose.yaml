services:
  servers-manager:
    image: watchwolf-servers-manager:dev
    build:
      context: ${WATCHWOLF_SERVERS_MANAGER_RELEASE_DIR:-../WatchWolf-ServersManager/ci/release}
    ports:
      - "8000:8000"
    environment:
      MACHINE_IP: ${WATCHWOLF_MACHINE_IP:-127.0.0.1}
      PUBLIC_IP: ${WATCHWOLF_PUBLIC_IP:-127.0.0.1}
      PARENT_PWD: ${WATCHWOLF_SERVERS_MANAGER_RELEASE_DIR:-../WatchWolf-ServersManager/ci/release}
      SERVER_PATH_SHIFT: .
      WATCHWOLF_MINECRAFT_RUNTIME: ${WATCHWOLF_MINECRAFT_RUNTIME:-itzg}
      WATCHWOLF_ITZG_IMAGE: ${WATCHWOLF_ITZG_IMAGE:-itzg/minecraft-server}
      WATCHWOLF_ITZG_TAG: ${WATCHWOLF_ITZG_TAG:-auto}
    volumes:
      - ${WATCHWOLF_SERVERS_MANAGER_RELEASE_DIR:-../WatchWolf-ServersManager/ci/release}/server-types:/servers/server-types
      - ${WATCHWOLF_SERVERS_MANAGER_RELEASE_DIR:-../WatchWolf-ServersManager/ci/release}/usual-plugins:/servers/usual-plugins
      - ${WATCHWOLF_SERVERS_MANAGER_RELEASE_DIR:-../WatchWolf-ServersManager/ci/release}/logs:/servers/logs
      - ${WATCHWOLF_SERVERS_MANAGER_RELEASE_DIR:-../WatchWolf-ServersManager/ci/release}/tmp:/servers/tmp
      - /var/run/docker.sock:/var/run/docker.sock

  clients-manager:
    image: ${WATCHWOLF_CLIENTS_IMAGE:-clients-manager:latest}
    ports:
      - "7000-7199:7000-7199"
    environment:
      MACHINE_IP: ${WATCHWOLF_MACHINE_IP:-127.0.0.1}
      PUBLIC_IP: ${WATCHWOLF_PUBLIC_IP:-127.0.0.1}
