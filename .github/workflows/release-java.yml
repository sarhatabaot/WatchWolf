name: Release WatchWolfX Java artifacts

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - uses: gradle/actions/setup-gradle@v4

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" == v* ]]
          PROJECT_VERSION=$(bash ./watchwolfx-core/gradlew -q -p watchwolfx-core properties | awk '/^version: / { print $2 }')
          test -n "$PROJECT_VERSION"
          test "${RELEASE_TAG#v}" = "$PROJECT_VERSION"
          test "$(bash ./watchwolfx-server/gradlew -q -p watchwolfx-server properties | awk '/^version: / { print $2 }')" = "$PROJECT_VERSION"
          test "$(bash ./watchwolfx-servermanager/gradlew -q -p watchwolfx-servermanager properties | awk '/^version: / { print $2 }')" = "$PROJECT_VERSION"
          test "$(bash ./watchwolfx-tester/gradlew -q -p watchwolfx-tester properties | awk '/^version: / { print $2 }')" = "$PROJECT_VERSION"
          test "$(python -c 'import tomllib; print(tomllib.load(open("watchwolfx-clientsmanager/pyproject.toml", "rb"))["project"]["version"])')" = "$PROJECT_VERSION"
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> "$GITHUB_ENV"

      - name: Build, test and publish Core
        working-directory: watchwolfx-core
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./gradlew --no-daemon clean check assemble publish

      - name: Provide Core to downstream builds
        run: |
          CORE_JAR="watchwolfx-core/build/libs/watchwolfx-core-${PROJECT_VERSION}.jar"
          install -D "$CORE_JAR" "watchwolfx-server/lib/$(basename "$CORE_JAR")"
          install -D "$CORE_JAR" "watchwolfx-servermanager/lib/$(basename "$CORE_JAR")"

      - name: Build, test and publish Server
        working-directory: watchwolfx-server
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon clean check assemble publish

      - name: Build and test ServerManager
        working-directory: watchwolfx-servermanager
        run: ./gradlew --no-daemon clean check assemble

      - name: Build and publish Tester
        working-directory: watchwolfx-tester
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon clean assemble publish

      - name: Upload release artifacts and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir release-assets
          cp "watchwolfx-core/build/libs/watchwolfx-core-${PROJECT_VERSION}.jar" release-assets/
          cp "watchwolfx-server/build/libs/WatchWolf-${PROJECT_VERSION}-1.8-LATEST.jar" release-assets/
          cp "watchwolfx-servermanager/build/libs/watchwolfx-servermanager-${PROJECT_VERSION}.jar" release-assets/
          cp "watchwolfx-tester/build/libs/watchwolfx-tester-${PROJECT_VERSION}.jar" release-assets/
          (cd release-assets && sha256sum ./*.jar > SHA256SUMS)
          gh release upload "$RELEASE_TAG" ./release-assets/* --clobber
