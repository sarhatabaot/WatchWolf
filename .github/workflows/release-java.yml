name: Release WatchWolfX Java artifacts

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - uses: gradle/actions/setup-gradle@v4

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" == v* ]]
          test "${RELEASE_TAG#v}" = "0.5.0"

      - name: Build, test and publish Core
        working-directory: watchwolfx-core
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn --batch-mode --no-transfer-progress clean deploy

      - name: Provide Core to downstream builds
        run: |
          install -D watchwolfx-core/target/watchwolfx-core-0.5.0.jar \
            watchwolfx-server/lib/watchwolfx-core-0.5.0.jar
          install -D watchwolfx-core/target/watchwolfx-core-0.5.0.jar \
            watchwolfx-servermanager/lib/watchwolfx-core-0.5.0.jar

      - name: Build, test and publish Server
        working-directory: watchwolfx-server
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon clean check assemble publish

      - name: Build and test ServerManager
        working-directory: watchwolfx-servermanager
        run: ./gradlew --no-daemon clean check assemble

      - name: Build and publish Tester
        working-directory: watchwolfx-tester
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon clean assemble publish

      - name: Upload release artifacts and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir release-assets
          cp watchwolfx-core/target/watchwolfx-core-0.5.0.jar release-assets/
          cp watchwolfx-server/build/libs/WatchWolf-0.5.0-1.8-LATEST.jar release-assets/
          cp watchwolfx-servermanager/build/libs/watchwolfx-servermanager-0.5.0.jar release-assets/
          cp watchwolfx-tester/build/libs/watchwolfx-tester-0.5.0.jar release-assets/
          (cd release-assets && sha256sum *.jar > SHA256SUMS)
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
