name: Release WatchWolfX ServerManager image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" == v* ]]
          EXPECTED_VERSION="${RELEASE_TAG#v}"
          test "$(bash ./watchwolfx-core/gradlew -q -p watchwolfx-core properties | awk '/^version: / { print $2 }')" = "$EXPECTED_VERSION"
          test "$(bash ./watchwolfx-server/gradlew -q -p watchwolfx-server properties | awk '/^version: / { print $2 }')" = "$EXPECTED_VERSION"
          test "$(bash ./watchwolfx-servermanager/gradlew -q -p watchwolfx-servermanager properties | awk '/^version: / { print $2 }')" = "$EXPECTED_VERSION"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/watchwolfx-servermanager
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./watchwolfx-servermanager/ci/ghcr/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
