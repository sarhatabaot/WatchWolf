name: Release Clients Manager image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      CLIENT_SOURCE_REF: e0ae1f3893d4043c57857120bd0ec4b17035a28d
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: https://github.com/miranda1000/WatchWolf-Client.git#${{ env.CLIENT_SOURCE_REF }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/watchwolf-clients-manager:${{ github.event.release.tag_name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
